<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Zubair's Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">My Portfolio</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#projects"
                >Projects</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header class="text-center py-5">
      <h1>Zubair Jamil</h1>
      <p>Full Stack Developer</p>
    </header>
    <section id="projects" class="container mt-5">
      <h2 class="text-center mb-5">Projects</h2>
      <div class="row text-center w-100">
        <div class="col-md-4">
          <div class="card">
            <img
              src="project-1.png"
              class="card-img-top"
              alt="Project 1 Image"
            />
            <div class="card-body">
              <h5 class="card-title">Project Title 1</h5>
              <p class="card-text">Project Description 1</p>
              <a href="project-link.html" class="btn btn-primary"
                >View Project</a
              >
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <img
              src="project-2.png"
              class="card-img-top"
              alt="Project 2 Image"
            />
            <div class="card-body">
              <h5 class="card-title">Project Title 2</h5>
              <p class="card-text">Project Description 2</p>
              <a href="project-link.html" class="btn btn-primary"
                >View Project</a
              >
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <img
              src="project-3.png"
              class="card-img-top"
              alt="Project 3 Image"
            />
            <div class="card-body">
              <h5 class="card-title">Project Title 3</h5>
              <p class="card-text">Project Description 3</p>
              <a href="project-link.html" class="btn btn-primary"
                >View Project</a
              >
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="contact" class="container mt-5">
      <h2 class="text-center mb-5">Contact</h2>
      <form class="mb-3">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </section>
    <footer class="bg-dark text-white text-center py-3">
      <p>&copy; 2026 Zubair Jamil. All rights reserved.</p>
      <div class="social-icons d-flex gap-3 justify-content-center">
        <i class="bi bi-facebook"></i>
        <i class="bi bi-twitter"></i>
        <i class="bi bi-github"></i>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
